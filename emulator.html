<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MacBook Emulator — Chrome + Discord UI Mock</title>
  <style>
    :root {
      --text: #ffffff;
      --muted: #9aa0a6;
      --chrome-bg: #202124;
      --chrome-tabbar: #35363a;
      --chrome-tab: #4a4b4f;
      --discord-bg: #313338;
      --discord-sidebar: #2b2d31;
      --discord-rail: #1e1f22;
      --discord-input: #383a40;
      --blur: blur(18px);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(88, 101, 242, 0.22), transparent 30%),
        radial-gradient(circle at 80% 30%, rgba(235, 69, 158, 0.18), transparent 28%),
        radial-gradient(circle at 50% 80%, rgba(35, 165, 90, 0.12), transparent 30%),
        #0a0a0c;
      color: var(--text);
    }

    .scene {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }

    .macbook {
      width: min(1180px, 98vw);
    }

    .screen {
      position: relative;
      aspect-ratio: 16 / 10;
      border-radius: 26px 26px 0 0;
      border: 10px solid #0b0b0d;
      border-bottom: 0;
      background: #000;
      overflow: hidden;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.55),
        inset 0 0 0 2px rgba(255, 255, 255, 0.04);
    }

    .wallpaper {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 25% 20%, rgba(90, 130, 255, 0.55), transparent 32%),
        radial-gradient(circle at 75% 25%, rgba(255, 90, 170, 0.36), transparent 30%),
        radial-gradient(circle at 50% 75%, rgba(45, 200, 120, 0.22), transparent 35%),
        linear-gradient(135deg, #101216, #1b2030 45%, #0d0f14);
    }

    .menubar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      background: rgba(255, 255, 255, 0.14);
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      color: rgba(255, 255, 255, 0.95);
      font-size: 13px;
      user-select: none;
      z-index: 11000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .menubar .left,
    .menubar .right {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .active-app {
      font-weight: 700;
      margin: 0 4px;
      white-space: nowrap;
    }

    .menu-items {
      display: flex;
      align-items: center;
      gap: 2px;
      min-width: 0;
      overflow: hidden;
    }

    .menu-btn {
      background: none;
      border: 0;
      color: inherit;
      font: inherit;
      padding: 2px 8px;
      border-radius: 6px;
      cursor: default;
      white-space: nowrap;
    }

    .menu-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .apple-btn {
      font-size: 15px;
      line-height: 1;
    }

    .status-btn {
      background: none;
      border: 0;
      color: inherit;
      font: inherit;
      padding: 2px 6px;
      border-radius: 6px;
      cursor: default;
    }

    .status-btn:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .clock {
      padding: 2px 8px;
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .menu-dropdown {
      position: absolute;
      top: 34px;
      left: 8px;
      min-width: 230px;
      padding: 6px;
      border-radius: 12px;
      background: rgba(28, 28, 30, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      -webkit-backdrop-filter: blur(24px);
      backdrop-filter: blur(24px);
      display: none;
      z-index: 12000;
    }

    .menu-dropdown.open { display: block; }

    .menu-dropdown button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      color: #fff;
      font: inherit;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: default;
    }

    .menu-dropdown button:hover {
      background: #0a60ff;
    }

    .menu-dropdown hr {
      border: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.14);
      margin: 5px 8px;
    }

    .desktop {
      position: absolute;
      inset: 30px 0 0 0;
    }

    .dock {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 10px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.16);
      -webkit-backdrop-filter: blur(22px);
      backdrop-filter: blur(22px);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      user-select: none;
      z-index: 10000;
    }

    .dock-icon {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.16s ease;
    }

    .dock-icon:hover {
      transform: translateY(-8px) scale(1.1);
    }

    .dock-icon .app {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
    }

    .finder-icon {
      background: linear-gradient(180deg, #5cc3ff, #0a60d8);
      position: relative;
      overflow: hidden;
    }

    .finder-icon::before {
      content: "";
      position: absolute;
      left: 25%;
      top: 22%;
      width: 8px;
      height: 14px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 18px 0 0 rgba(255, 255, 255, 0.92);
    }

    .finder-icon::after {
      content: "";
      position: absolute;
      left: 24%;
      bottom: 18%;
      width: 52%;
      height: 16px;
      border: 3px solid rgba(255, 255, 255, 0.92);
      border-top: 0;
      border-radius: 0 0 16px 16px;
    }

    .chrome-icon {
      background: conic-gradient(from 0deg, #ea4335 0 120deg, #fbbc05 120deg 240deg, #34a853 240deg 360deg);
      position: relative;
      overflow: hidden;
    }

    .chrome-icon::before {
      content: "";
      position: absolute;
      inset: 14px;
      background: #fff;
      border-radius: 50%;
    }

    .chrome-icon::after {
      content: "";
      position: absolute;
      inset: 19px;
      background: #4285f4;
      border-radius: 50%;
    }

    .discord-icon {
      background: #5865f2;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .discord-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .trash-icon {
      background: rgba(255, 255, 255, 0.14);
      display: grid;
      place-items: center;
      font-size: 24px;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }

    .dock-separator {
      width: 1px;
      height: 44px;
      background: rgba(255, 255, 255, 0.22);
      margin: 0 2px;
      align-self: center;
    }

    .dock-icon.running::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
    }

    .window {
      position: absolute;
      display: flex;
      flex-direction: column;
      background: #232428;
      color: #e8eaed;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      min-width: 520px;
      min-height: 340px;
      resize: both;
    }

    .window::after {
      content: "";
      position: absolute;
      right: 2px;
      bottom: 2px;
      width: 14px;
      height: 14px;
      pointer-events: none;
      opacity: 0.28;
      background:
        linear-gradient(135deg,
          transparent 0 50%,
          rgba(255, 255, 255, 0.45) 50% 60%,
          transparent 60% 72%,
          rgba(255, 255, 255, 0.45) 72% 82%,
          transparent 82%);
    }

    .window.focused {
      box-shadow: 0 36px 95px rgba(0, 0, 0, 0.62);
      border-color: rgba(255, 255, 255, 0.14);
    }

    .window.minimized,
    .window.hidden {
      display: none;
    }

    .window.maximized {
      left: 8px !important;
      top: 6px !important;
      width: calc(100% - 16px) !important;
      height: calc(100% - 88px) !important;
      border-radius: 14px;
      resize: none;
    }

    .window.maximized::after { display: none; }

    .traffic-lights {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 8px;
      z-index: 30;
    }

    .traffic-lights button {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 0;
      padding: 0;
      cursor: pointer;
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.18);
    }

    .window:not(.focused) .traffic-lights button {
      background: #5f6063;
    }

    .tl-close { background: #ff5f57; }
    .tl-min { background: #febc2e; }
    .tl-max { background: #28c840; }

    .draggable {
      user-select: none;
      cursor: grab;
    }

    .draggable:active { cursor: grabbing; }

    /* Chrome */
    .chrome-window {
      background: var(--chrome-bg);
    }

    .chrome-tabbar {
      height: 44px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      padding: 0 12px 0 84px;
      background: var(--chrome-tabbar);
    }

    .chrome-tabbar .tabs {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 100%;
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .chrome-tab {
      max-width: 220px;
      min-width: 120px;
      height: 34px;
      background: var(--chrome-tab);
      border-radius: 10px 10px 0 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      font-size: 13px;
      color: #e8eaed;
      cursor: pointer;
      position: relative;
      flex: 0 1 auto;
    }

    .chrome-tab.active {
      background: var(--chrome-bg);
    }

    .chrome-tab .favicon {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      flex: none;
    }

    .chrome-tab .title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chrome-tab .close {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 0;
      background: transparent;
      color: #bdc1c6;
      cursor: pointer;
      flex: none;
      font-size: 14px;
      line-height: 1;
    }

    .chrome-tab .close:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .new-tab-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 0;
      background: transparent;
      color: #e8eaed;
      font-size: 20px;
      cursor: pointer;
      margin-bottom: 5px;
      flex: none;
    }

    .new-tab-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .chrome-toolbar {
      height: 48px;
      background: var(--chrome-bg);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 0;
      background: transparent;
      color: #bdc1c6;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 16px;
      flex: none;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .icon-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .icon-btn:disabled:hover {
      background: transparent;
      color: #bdc1c6;
    }

    .avatar-btn {
      background: linear-gradient(135deg, #f23f42, #f0b232);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .addressbar {
      flex: 1;
      height: 34px;
      background: #303134;
      border-radius: 17px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
      color: #9aa0a6;
      min-width: 0;
    }

    .addressbar .lock {
      font-size: 13px;
      opacity: 0.8;
      flex: none;
    }

    .addressbar input {
      flex: 1;
      background: transparent;
      border: 0;
      outline: 0;
      color: #e8eaed;
      font-size: 14px;
      min-width: 0;
    }

    .chrome-bookmarks {
      height: 34px;
      background: var(--chrome-bg);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      overflow: auto;
      white-space: nowrap;
    }

    .bookmark {
      height: 26px;
      padding: 0 10px;
      border-radius: 14px;
      border: 0;
      background: rgba(255, 255, 255, 0.06);
      color: #e8eaed;
      font-size: 12px;
      cursor: pointer;
      flex: none;
    }

    .bookmark:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .chrome-content {
      flex: 1;
      min-height: 0;
      overflow: auto;
      background: var(--chrome-bg);
      position: relative;
    }

    .newtab-page {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 50% 0%, rgba(138, 180, 248, 0.12), transparent 30%),
        var(--chrome-bg);
    }

    .newtab-card {
      width: min(620px, 100%);
      text-align: center;
    }

    .mock-logo {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 24px;
    }

    .mock-logo span { color: #8ab4f8; }

    .searchbar {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 44px;
      background: #303134;
      border-radius: 22px;
      padding: 0 18px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .searchbar input {
      flex: 1;
      background: none;
      border: 0;
      outline: 0;
      color: #e8eaed;
      font-size: 15px;
      min-width: 0;
    }

    .shortcuts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-top: 28px;
    }

    .shortcut {
      background: transparent;
      border: 0;
      color: #bdc1c6;
      font-size: 12px;
      cursor: pointer;
      display: grid;
      gap: 8px;
      justify-items: center;
      padding: 10px;
      border-radius: 12px;
    }

    .shortcut:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
    }

    .shortcut-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--c, #303134);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 18px;
    }

    .fineprint {
      color: #9aa0a6;
      font-size: 12px;
      margin-top: 26px;
      line-height: 1.5;
    }

    .placeholder-page {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .placeholder-card {
      width: min(620px, 100%);
      background: #292a2d;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
    }

    .placeholder-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .placeholder-card h2 {
      margin: 0 0 10px;
      font-size: 24px;
      color: #e8eaed;
      word-break: break-word;
    }

    .placeholder-card p {
      color: #9aa0a6;
      line-height: 1.5;
      margin: 0;
    }

    .placeholder-card code {
      display: inline-block;
      margin-top: 14px;
      background: #17181a;
      color: #8ab4f8;
      padding: 8px 12px;
      border-radius: 8px;
      word-break: break-all;
    }

    .spin {
      animation: spin 0.6s ease;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Discord */
    .discord-window {
      background: var(--discord-bg);
      color: #dbdee1;
    }

    .discord-body {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .server-rail {
      width: 72px;
      background: var(--discord-rail);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 36px 0 10px;
      overflow: visible;
      flex: none;
    }

    .server-icon {
      width: 48px;
      height: 48px;
      border-radius: 24px;
      background: #5865f2;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: border-radius 0.15s ease, background 0.15s ease;
      position: relative;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      flex: none;
    }

    .server-icon:hover,
    .server-icon.active {
      border-radius: 16px;
    }

    .server-icon.active::before {
      content: "";
      position: absolute;
      left: -10px;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 36px;
      border-radius: 4px;
      background: #fff;
    }

    .server-icon.add {
      background: #2b2d31;
      color: #23a55a;
      font-size: 24px;
    }

    .server-icon.home {
      background: #5865f2;
      font-size: 13px;
    }

    .server-icon.home svg {
      width: 24px;
      height: 24px;
    }

    .server-icon.dm-contact {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      overflow: visible;
      padding: 0;
      transition: border-radius 0.15s ease;
      position: relative;
    }

    .server-icon.dm-contact:hover,
    .server-icon.dm-contact.active {
      border-radius: 16px;
    }

    .server-icon.dm-contact img {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      object-fit: cover;
      display: block;
    }

    .server-icon.dm-contact .dm-ping-badge {
      position: absolute;
      bottom: -3px;
      right: -5px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 10px;
      background: #f23f42;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      display: none;
      place-items: center;
      border: 3px solid #1e1f22;
      line-height: 1;
      z-index: 10;
    }

    .server-icon.dm-contact .dm-ping-badge.show {
      display: grid;
    }

    .server-separator {
      width: 32px;
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 1px;
      flex: none;
    }

    .channel-sidebar {
      width: 240px;
      background: var(--discord-sidebar);
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: none;
    }

    .server-name {
      height: 48px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      color: #f2f3f5;
      border-bottom: 1px solid #1f2124;
      cursor: grab;
      user-select: none;
      flex: none;
    }

    .server-name::after {
      content: "▾";
      color: #b5bac1;
      font-size: 12px;
    }

    .channels {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 12px 8px;
    }

    .channel-category {
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #949ba4;
      padding: 14px 8px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
    }

    .category-add {
      opacity: 0.7;
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 6px;
      color: #949ba4;
      cursor: pointer;
      font-size: 14px;
      margin: 1px 0;
    }

    .channel-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: #dbdee1;
    }

    .channel-item.active {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .channel-prefix {
      width: 18px;
      text-align: center;
      color: #80848e;
      flex: none;
      font-size: 15px;
    }

    .channel-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .user-panel {
      height: 52px;
      background: #232428;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      flex: none;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      flex: none;
      object-fit: cover;
    }

    .avatar.small {
      width: 28px;
      height: 28px;

            <span id="activeAppName" class="active-app">Finder</span>
            <div id="appMenus" class="menu-items"></div>
          </div>
          <div class="right">
            <button class="status-btn" title="Wi-Fi">📶</button>
            <button class="status-btn" title="Battery">🔋</button>
            <button class="status-btn" title="Control Center">🎛️</button>
            <span id="clock" class="clock"></span>
          </div>
        </div>

        <div class="menu-dropdown" id="menuDropdown">
          <button data-action="About This Mac is visual only.">About This Mac</button>
          <hr />
          <button data-action="System Settings is visual only.">System Settings…</button>
          <button data-action="App Store is visual only.">App Store…</button>
          <hr />
          <button data-action="Sleep is visual only.">Sleep</button>
          <button data-action="Restart is visual only.">Restart…</button>
          <button data-action="Shut Down is visual only.">Shut Down…</button>
          <hr />
          <button data-action="Lock Screen is visual only.">Lock Screen</button>
        </div>

        <div class="desktop" id="desktop">
          <div class="dock" id="dock">
            <div class="dock-icon" data-app="finder" data-name="Finder" title="Finder">
              <div class="app finder-icon"></div>
            </div>
            <div class="dock-icon" data-app="chrome" data-name="Chrome" title="Chrome">
              <div class="app chrome-icon"></div>
            </div>
            <div class="dock-icon" data-app="discord" data-name="Discord" title="Discord">
              <div class="app discord-icon"><img src="static/discord-icon.png" alt="Discord" /></div>
              <span class="dock-badge hidden" id="discordDockBadge">1</span>
            </div>
            <div class="dock-separator"></div>
            <div class="dock-icon" data-app="trash" data-name="Trash" title="Trash">
              <div class="app trash-icon">🗑️</div>
            </div>
          </div>
        </div>

        <div class="notification notification-birthday" id="birthdayNotification" role="button" tabindex="0" aria-label="Open Discord message">
          <div class="notification-icon"><img src="static/hanaria.webp" alt="Hanaria" /></div>
          <div class="notification-content">
            <div class="notification-title">Discord</div>
            <div class="notification-subtitle">Taskforce • #rule</div>
            <div class="notification-text">
              HAPPY BIRTHDAY STRAY! WE ARE SO SORRY WE FORGOT TO GIVE U A GIFT.
            </div>
          </div>
          <button class="n-close" data-n-close="birthday" title="Dismiss">✕</button>
        </div>

        <div class="notification notification-dm" id="dmNotification" role="button" tabindex="0" aria-label="Open message from Sofia">
          <div class="notification-icon" style="background:#9b59b6;overflow:hidden"><img src="static/sofia.webp" alt="Sofia" /></div>
          <div class="notification-content">
            <div class="notification-title">Sofia</div>
            <div class="notification-subtitle">Direct Message</div>
            <div class="notification-text">HELP</div>
          </div>
          <button class="n-close" data-n-close="dm" title="Dismiss">✕</button>
        </div>

        <div class="notification notification-hint" id="hintNotification" role="button" tabindex="0" aria-label="Hint">
          <div class="notification-icon h-icon">💡</div>
          <div class="notification-content">
            <div class="notification-title h-title">Hint</div>
            <div class="notification-subtitle h-sub"></div>
            <div class="notification-text h-text"></div>
          </div>
          <button class="n-close" data-n-close="hint" title="Dismiss">✕</button>
        </div>

        <div class="toast" id="toast"></div>
      </div>

      <div class="base"></div>
    </div>
  </div>
