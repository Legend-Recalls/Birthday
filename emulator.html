<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MacBook Emulator — Chrome + Discord UI Mock</title>
  <style>
    :root {
      --text: #ffffff;
      --muted: #9aa0a6;
      --chrome-bg: #202124;
      --chrome-tabbar: #35363a;
      --chrome-tab: #4a4b4f;
      --discord-bg: #313338;
      --discord-sidebar: #2b2d31;
      --discord-rail: #1e1f22;
      --discord-input: #383a40;
      --blur: blur(18px);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(88, 101, 242, 0.22), transparent 30%),
        radial-gradient(circle at 80% 30%, rgba(235, 69, 158, 0.18), transparent 28%),
        radial-gradient(circle at 50% 80%, rgba(35, 165, 90, 0.12), transparent 30%),
        #0a0a0c;
      color: var(--text);
    }

    .scene {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }

    .macbook {
      width: min(1180px, 98vw);
    }

    .screen {
      position: relative;
      aspect-ratio: 16 / 10;
      border-radius: 26px 26px 0 0;
      border: 10px solid #0b0b0d;
      border-bottom: 0;
      background: #000;
      overflow: hidden;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.55),
        inset 0 0 0 2px rgba(255, 255, 255, 0.04);
    }

    .wallpaper {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 25% 20%, rgba(90, 130, 255, 0.55), transparent 32%),
        radial-gradient(circle at 75% 25%, rgba(255, 90, 170, 0.36), transparent 30%),
        radial-gradient(circle at 50% 75%, rgba(45, 200, 120, 0.22), transparent 35%),
        linear-gradient(135deg, #101216, #1b2030 45%, #0d0f14);
    }

    .menubar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      background: rgba(255, 255, 255, 0.14);
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      color: rgba(255, 255, 255, 0.95);
      font-size: 13px;
      user-select: none;
      z-index: 11000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .menubar .left,
    .menubar .right {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .active-app {
      font-weight: 700;
      margin: 0 4px;
      white-space: nowrap;
    }

    .menu-items {
      display: flex;
      align-items: center;
      gap: 2px;
      min-width: 0;
      overflow: hidden;
    }

    .menu-btn {
      background: none;
      border: 0;
      color: inherit;
      font: inherit;
      padding: 2px 8px;
      border-radius: 6px;
      cursor: default;
      white-space: nowrap;
    }

    .menu-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .apple-btn {
      font-size: 15px;
      line-height: 1;
    }

    .status-btn {
      background: none;
      border: 0;
      color: inherit;
      font: inherit;
      padding: 2px 6px;
      border-radius: 6px;
      cursor: default;
    }

    .status-btn:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .clock {
      padding: 2px 8px;
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .menu-dropdown {
      position: absolute;
      top: 34px;
      left: 8px;
      min-width: 230px;
      padding: 6px;
      border-radius: 12px;
      background: rgba(28, 28, 30, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      -webkit-backdrop-filter: blur(24px);
      backdrop-filter: blur(24px);
      display: none;
      z-index: 12000;
    }

    .menu-dropdown.open { display: block; }

    .menu-dropdown button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      color: #fff;
      font: inherit;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: default;
    }

    .menu-dropdown button:hover {
      background: #0a60ff;
    }

    .menu-dropdown hr {
      border: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.14);
      margin: 5px 8px;
    }

    .desktop {
      position: absolute;
      inset: 30px 0 0 0;
    }

    .dock {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 10px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.16);
      -webkit-backdrop-filter: blur(22px);
      backdrop-filter: blur(22px);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      user-select: none;
      z-index: 10000;
    }

    .dock-icon {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.16s ease;
    }

    .dock-icon:hover {
      transform: translateY(-8px) scale(1.1);
    }

    .dock-icon .app {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
    }

    .finder-icon {
      background: linear-gradient(180deg, #5cc3ff, #0a60d8);
      position: relative;
      overflow: hidden;
    }

    .finder-icon::before {
      content: "";
      position: absolute;
      left: 25%;
      top: 22%;
      width: 8px;
      height: 14px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 18px 0 0 rgba(255, 255, 255, 0.92);
    }

    .finder-icon::after {
      content: "";
      position: absolute;
      left: 24%;
      bottom: 18%;
      width: 52%;
      height: 16px;
      border: 3px solid rgba(255, 255, 255, 0.92);
      border-top: 0;
      border-radius: 0 0 16px 16px;
    }

    .chrome-icon {
      background: conic-gradient(from 0deg, #ea4335 0 120deg, #fbbc05 120deg 240deg, #34a853 240deg 360deg);
      position: relative;
      overflow: hidden;
    }

    .chrome-icon::before {
      content: "";
      position: absolute;
      inset: 14px;
      background: #fff;
      border-radius: 50%;
    }

    .chrome-icon::after {
      content: "";
      position: absolute;
      inset: 19px;
      background: #4285f4;
      border-radius: 50%;
    }

    .discord-icon {
      background: #5865f2;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .discord-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .trash-icon {
      background: rgba(255, 255, 255, 0.14);
      display: grid;
      place-items: center;
      font-size: 24px;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }

    .dock-separator {
      width: 1px;
      height: 44px;
      background: rgba(255, 255, 255, 0.22);
      margin: 0 2px;
      align-self: center;
    }

    .dock-icon.running::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
    }

    .window {
      position: absolute;
      display: flex;
      flex-direction: column;
      background: #232428;
      color: #e8eaed;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      min-width: 520px;
      min-height: 340px;
      resize: both;
    }

    .window::after {
      content: "";
      position: absolute;
      right: 2px;
      bottom: 2px;
      width: 14px;
      height: 14px;
      pointer-events: none;
      opacity: 0.28;
      background:
        linear-gradient(135deg,
          transparent 0 50%,
          rgba(255, 255, 255, 0.45) 50% 60%,
          transparent 60% 72%,
          rgba(255, 255, 255, 0.45) 72% 82%,
          transparent 82%);
    }

    .window.focused {
      box-shadow: 0 36px 95px rgba(0, 0, 0, 0.62);
      border-color: rgba(255, 255, 255, 0.14);
    }

    .window.minimized,
    .window.hidden {
      display: none;
    }

    .window.maximized {
      left: 8px !important;
      top: 6px !important;
      width: calc(100% - 16px) !important;
      height: calc(100% - 88px) !important;
      border-radius: 14px;
      resize: none;
    }

    .window.maximized::after { display: none; }

    .traffic-lights {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 8px;
      z-index: 30;
    }

    .traffic-lights button {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 0;
      padding: 0;
      cursor: pointer;
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.18);
    }

    .window:not(.focused) .traffic-lights button {
      background: #5f6063;
    }

    .tl-close { background: #ff5f57; }
    .tl-min { background: #febc2e; }
    .tl-max { background: #28c840; }

    .draggable {
      user-select: none;
      cursor: grab;
    }

    .draggable:active { cursor: grabbing; }

    /* Chrome */
    .chrome-window {
      background: var(--chrome-bg);
    }

    .chrome-tabbar {
      height: 44px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      padding: 0 12px 0 84px;
      background: var(--chrome-tabbar);
    }

    .chrome-tabbar .tabs {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 100%;
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .chrome-tab {
      max-width: 220px;
      min-width: 120px;
      height: 34px;
      background: var(--chrome-tab);
      border-radius: 10px 10px 0 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      font-size: 13px;
      color: #e8eaed;
      cursor: pointer;
      position: relative;
      flex: 0 1 auto;
    }

    .chrome-tab.active {
      background: var(--chrome-bg);
    }

    .chrome-tab .favicon {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      flex: none;
    }

    .chrome-tab .title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chrome-tab .close {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 0;
      background: transparent;
      color: #bdc1c6;
      cursor: pointer;
      flex: none;
      font-size: 14px;
      line-height: 1;
    }

    .chrome-tab .close:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .new-tab-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 0;
      background: transparent;
      color: #e8eaed;
      font-size: 20px;
      cursor: pointer;
      margin-bottom: 5px;
      flex: none;
    }

    .new-tab-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .chrome-toolbar {
      height: 48px;
      background: var(--chrome-bg);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 0;
      background: transparent;
      color: #bdc1c6;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 16px;
      flex: none;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .icon-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .icon-btn:disabled:hover {
      background: transparent;
      color: #bdc1c6;
    }

    .avatar-btn {
      background: linear-gradient(135deg, #f23f42, #f0b232);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .addressbar {
      flex: 1;
      height: 34px;
      background: #303134;
      border-radius: 17px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
      color: #9aa0a6;
      min-width: 0;
    }

    .addressbar .lock {
      font-size: 13px;
      opacity: 0.8;
      flex: none;
    }

    .addressbar input {
      flex: 1;
      background: transparent;
      border: 0;
      outline: 0;
      color: #e8eaed;
      font-size: 14px;
      min-width: 0;
    }

    .chrome-bookmarks {
      height: 34px;
      background: var(--chrome-bg);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      overflow: auto;
      white-space: nowrap;
    }

    .bookmark {
      height: 26px;
      padding: 0 10px;
      border-radius: 14px;
      border: 0;
      background: rgba(255, 255, 255, 0.06);
      color: #e8eaed;
      font-size: 12px;
      cursor: pointer;
      flex: none;
    }

    .bookmark:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .chrome-content {
      flex: 1;
      min-height: 0;
      overflow: auto;
      background: var(--chrome-bg);
      position: relative;
    }

    .newtab-page {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 50% 0%, rgba(138, 180, 248, 0.12), transparent 30%),
        var(--chrome-bg);
    }

    .newtab-card {
      width: min(620px, 100%);
      text-align: center;
    }

    .mock-logo {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 24px;
    }

    .mock-logo span { color: #8ab4f8; }

    .searchbar {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 44px;
      background: #303134;
      border-radius: 22px;
      padding: 0 18px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .searchbar input {
      flex: 1;
      background: none;
      border: 0;
      outline: 0;
      color: #e8eaed;
      font-size: 15px;
      min-width: 0;
    }

    .shortcuts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-top: 28px;
    }

    .shortcut {
      background: transparent;
      border: 0;
      color: #bdc1c6;
      font-size: 12px;
      cursor: pointer;
      display: grid;
      gap: 8px;
      justify-items: center;
      padding: 10px;
      border-radius: 12px;
    }

    .shortcut:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
    }

    .shortcut-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--c, #303134);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 18px;
    }

    .fineprint {
      color: #9aa0a6;
      font-size: 12px;
      margin-top: 26px;
      line-height: 1.5;
    }

    .placeholder-page {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .placeholder-card {
      width: min(620px, 100%);
      background: #292a2d;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
    }

    .placeholder-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .placeholder-card h2 {
      margin: 0 0 10px;
      font-size: 24px;
      color: #e8eaed;
      word-break: break-word;
    }

    .placeholder-card p {
      color: #9aa0a6;
      line-height: 1.5;
      margin: 0;
    }

    .placeholder-card code {
      display: inline-block;
      margin-top: 14px;
      background: #17181a;
      color: #8ab4f8;
      padding: 8px 12px;
      border-radius: 8px;
      word-break: break-all;
    }

    .spin {
      animation: spin 0.6s ease;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Discord */
    .discord-window {
      background: var(--discord-bg);
      color: #dbdee1;
    }

    .discord-body {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .server-rail {
      width: 72px;
      background: var(--discord-rail);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 36px 0 10px;
      overflow: visible;
      flex: none;
    }

    .server-icon {
      width: 48px;
      height: 48px;
      border-radius: 24px;
      background: #5865f2;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: border-radius 0.15s ease, background 0.15s ease;
      position: relative;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      flex: none;
    }

    .server-icon:hover,
    .server-icon.active {
      border-radius: 16px;
    }

    .server-icon.active::before {
      content: "";
      position: absolute;
      left: -10px;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 36px;
      border-radius: 4px;
      background: #fff;
    }

    .server-icon.add {
      background: #2b2d31;
      color: #23a55a;
      font-size: 24px;
    }

    .server-icon.home {
      background: #5865f2;
      font-size: 13px;
    }

    .server-icon.home svg {
      width: 24px;
      height: 24px;
    }

    .server-icon.dm-contact {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      overflow: visible;
      padding: 0;
      transition: border-radius 0.15s ease;
      position: relative;
    }

    .server-icon.dm-contact:hover,
    .server-icon.dm-contact.active {
      border-radius: 16px;
    }

    .server-icon.dm-contact img {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      object-fit: cover;
      display: block;
    }

    .server-icon.dm-contact .dm-ping-badge {
      position: absolute;
      bottom: -3px;
      right: -5px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 10px;
      background: #f23f42;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      display: none;
      place-items: center;
      border: 3px solid #1e1f22;
      line-height: 1;
      z-index: 10;
    }

    .server-icon.dm-contact .dm-ping-badge.show {
      display: grid;
    }

    .server-separator {
      width: 32px;
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 1px;
      flex: none;
    }

    .channel-sidebar {
      width: 240px;
      background: var(--discord-sidebar);
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: none;
    }

    .server-name {
      height: 48px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      color: #f2f3f5;
      border-bottom: 1px solid #1f2124;
      cursor: grab;
      user-select: none;
      flex: none;
    }

    .server-name::after {
      content: "▾";
      color: #b5bac1;
      font-size: 12px;
    }

    .channels {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 12px 8px;
    }

    .channel-category {
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #949ba4;
      padding: 14px 8px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
    }

    .category-add {
      opacity: 0.7;
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 6px;
      color: #949ba4;
      cursor: pointer;
      font-size: 14px;
      margin: 1px 0;
    }

    .channel-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: #dbdee1;
    }

    .channel-item.active {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .channel-prefix {
      width: 18px;
      text-align: center;
      color: #80848e;
      flex: none;
      font-size: 15px;
    }

    .channel-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .user-panel {
      height: 52px;
      background: #232428;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      flex: none;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      flex: none;
      object-fit: cover;
    }

    .avatar.small {
      width: 28px;
      height: 28px;

    function escapeHTML(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"

    function makeDraggable(win, handle) {
      handle.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        if (e.target.closest("button, input, a, select, textarea, .chrome-tab, .channel-item, .server-icon, .member, .bookmark, .shortcut")) return;
        if (win.classList.contains("maximized")) return;

        focusWindow(win);

        const rect = win.getBoundingClientRect();
        const parentRect = desktop.getBoundingClientRect();
        const offsetX = e.clientX - rect.left;
        const offsetY = e.clientY - rect.top;

        handle.setPointerCapture(e.pointerId);

        const move = (ev) => {
          let x = ev.clientX - parentRect.left - offsetX;
          let y = ev.clientY - parentRect.top - offsetY;

          x = Math.min(Math.max(x, -rect.width + 120), parentRect.width - 120);
          y = Math.min(Math.max(y, 0), parentRect.height - 50);

          win.style.left = x + "px";
          win.style.top = y + "px";
        };

        const cleanup = () => {
          handle.removeEventListener("pointermove", move);
          handle.removeEventListener("pointerup", cleanup);
          handle.removeEventListener("pointercancel", cleanup);
          if (handle.hasPointerCapture && handle.hasPointerCapture(e.pointerId)) {
            handle.releasePointerCapture(e.pointerId);
          }
        };

        handle.addEventListener("pointermove", move);
        handle.addEventListener("pointerup", cleanup);
        handle.addEventListener("pointercancel", cleanup);
      });

      handle.addEventListener("dblclick", (e) => {
        if (e.target.closest("button, input, a, select, textarea, .chrome-tab, .channel-item, .server-icon, .member, .bookmark, .shortcut")) return;
        win.classList.toggle("maximized");
      });
    }

    function setupWindowControls(win) {

        win.remove();
        openApps.delete(app);
        if (activeApp === cap(app)) setMenuBar("Finder");
        updateDock();

      win.querySelector(".tl-min").addEventListener("click", (e) => {

      win.querySelector(".tl-max").addEventListener("click", (e) => {

        win.classList.toggle("maximized");
      });

      win.querySelectorAll(".draggable").forEach((handle) => makeDraggable(win, handle));
    }

        else setupDiscord(win);

        openApps.add(app);
      }

      win.classList.remove("minimized", "hidden");
      focusWindow(win);
      updateDock();
    }

    function faviconColor(url) {
      if (url.startsWith("chrome://")) return "#9aa0a6";
      if (url.includes("search")) return "#8ab4f8";

      let h = 0;
      for (const c of url) {

    function setupChrome(win) {
      const tabsEl = win.querySelector("#chromeTabs");
      const contentEl = win.querySelector("#chromeContent");
      const urlEl = win.querySelector("#chromeUrl");
      const backBtn = win.querySelector("#chromeBack");
      const forwardBtn = win.querySelector("#chromeForward");
      const reloadBtn = win.querySelector("#chromeReload");
      const newTabBtn = win.querySelector("#chromeNewTab");
      const starBtn = win.querySelector("#chromeStar");
      const extensionsBtn = win.querySelector("#chromeExtensions");
      const avatarBtn = win.querySelector(".avatar-btn");
      const bookmarksEl = win.querySelector("#chromeBookmarks");

      function createTab(url, title) {
        const id = (typeof crypto !== "undefined" && crypto.randomUUID)
          ? crypto.randomUUID()
          : "tab-" + Math.random().toString(36).slice(2);

        return {
          id,
          title,
          url,
          history: [{ url, title }],
          index: 0
        };
      }

      const state = {
        tabs: [
          createTab("chrome://newtab", "New Tab"),
          createTab("mock://local/ui-notes", "UI Notes")
        ],
        active: null
      };

      state.active = state.tabs[0].id;

      function currentTab() {
        return state.tabs.find((t) => t.id === state.active);
      }

      function prettyUrl(url) {
        return url
          .replace(/^mock:\/\//, "")
          .replace(/^https?:\/\//, "");
      }

      function normalizeUrl(raw) {
        raw = String(raw || "").trim();

        if (!raw) return "chrome://newtab";
        if (raw.toLowerCase() === "newtab") return "chrome://newtab";
        if (raw === "about:blank") return "about:blank";
        if (/^chrome:\/\//i.test(raw)) return raw;

        return "mock://" + raw.replace(/^[a-z]+:\/\//i, "").replace(/^\/+/, "");
      }

      function renderTabs() {
        tabsEl.innerHTML = state.tabs.map((t) => `
          <div class="chrome-tab ${t.id === state.active ? "active" : ""}" data-id="${t.id}" title="${escapeHTML(t.title)}">
            <span class="favicon" style="background:${faviconColor(t.url)}"></span>
            <span class="title">${escapeHTML(t.title)}</span>
            <button class="close" title="Close tab">×</button>
          </div>
        `).join("");
      }

      function renderView() {
        const tab = currentTab();
        if (!tab) return;

        urlEl.value = tab.url;
        backBtn.disabled = tab.index <= 0;
        forwardBtn.disabled = tab.index >= tab.history.length - 1;

        contentEl.innerHTML = tab.url === "chrome://newtab"
          ? newTabHTML()
          : placeholderPage(tab.url, tab.title);
      }

      function navigate(url, title, push = true) {
        const tab = currentTab();
        if (!tab) return;

        url = normalizeUrl(url);

        if (url === "chrome://newtab") title = "New Tab";
        if (!title) title = prettyUrl(url);

        if (push) {
          tab.history = tab.history.slice(0, tab.index + 1);
          tab.history.push({ url, title });
          tab.index = tab.history.length - 1;
        }

        tab.url = url;
        tab.title = title;

        renderTabs();
        renderView();
      }

      function go(delta) {
        const tab = currentTab();
        if (!tab) return;

        const entry = tab.history[tab.index + delta];
        if (!entry) return;

        tab.index += delta;
        tab.url = entry.url;
        tab.title = entry.title;

        renderTabs();
        renderView();
      }

      function closeTab(id) {
        const idx = state.tabs.findIndex((t) => t.id === id);
        if (idx === -1) return;

        state.tabs.splice(idx, 1);

        if (state.tabs.length === 0) {
          const t = createTab("chrome://newtab", "New Tab");
          state.tabs.push(t);
          state.active = t.id;
        } else if (state.active === id) {
          state.active = state.tabs[Math.max(0, idx - 1)].id;
        }

        renderTabs();
        renderView();
      }

      tabsEl.addEventListener("click", (e) => {
        const close = e.target.closest(".close");
        const tab = e.target.closest(".chrome-tab");
        if (!tab) return;

        const id = tab.dataset.id;

        if (close) {
          closeTab(id);
        } else {
          state.active = id;
          renderTabs();
          renderView();
        }
      });

      newTabBtn.addEventListener("click", () => {
        const t = createTab("chrome://newtab", "New Tab");
        state.tabs.push(t);
        state.active = t.id;
        renderTabs();
        renderView();
      });

      backBtn.addEventListener("click", () => go(-1));
      forwardBtn.addEventListener("click", () => go(1));

      reloadBtn.addEventListener("click", () => {
        reloadBtn.classList.remove("spin");
        void reloadBtn.offsetWidth;
        reloadBtn.classList.add("spin");
        showToast("Reload is visual only — no website is loaded.");
      });

      urlEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const url = normalizeUrl(urlEl.value);
          navigate(url, prettyUrl(url));
          urlEl.blur();
        }
      });

      urlEl.addEventListener("focus", () => urlEl.select());

      starBtn.addEventListener("click", () => {
        const starred = starBtn.classList.toggle("starred");
        starBtn.textContent = starred ? "★" : "☆";
        showToast(starred ? "Bookmark added — local UI only." : "Bookmark removed — local UI only.");
      });

      extensionsBtn.addEventListener("click", () => showToast("Extensions menu is visual only."));
      avatarBtn.addEventListener("click", () => showToast("Profile menu is visual only."));

      bookmarksEl.addEventListener("click", (e) => {
        const b = e.target.closest(".bookmark");
        if (!b) return;
        navigate(b.dataset.url, b.textContent.trim());
      });

      contentEl.addEventListener("keydown", (e) => {
        if (e.target.id === "newtabSearch" && e.key === "Enter") {
          const q = e.target.value.trim();
          if (!q) return;
          navigate("mock://search?q=" + encodeURIComponent(q), "Search: " + q);
        }
      });

      contentEl.addEventListener("click", (e) => {
        const s = e.target.closest(".shortcut");
        if (!s) return;
        navigate(s.dataset.url, s.dataset.title || s.textContent.trim());
      });

      renderTabs();
      renderView();
    }

    function setupDiscord(win) {
      const $ = (s) => win.querySelector(s);
      const serversEl = $("#discordServers");
      const homeTopEl = $("#discordHomeTop");
      const serverNameEl = $("#discordServerName");
      const channelsEl = $("#discordChannels");
      const titleTextEl = $("#discordTitleText");
      const headerEl = $("#discordHeader");
      const messagesEl = $("#discordMessages");
      const membersEl = $("#discordMembers");
      const inputWrap = $("#discordInputWrap");
      const input = $("#discordInput");
      const sendBtn = $("#discordSend");
      const muteBtn = $("#discordMute");
      const deafenBtn = $("#discordDeafen");
      const settingsBtn = $("#discordSettings");
      const userStatusEl = $("#discordUserStatus");

      const state = {
        activeServer: "s1",
        activeChannel: "general",
        muted: false,
        deafened: false,
        membersVisible: true,
        unreadRule: birthdayRuleUnread,
        unreadChannels: {},
        sofiaTriggered: false
      };

      function allServers() { return [discordHome, ...discordServers]; }
      function getServer(id) { return id === "home" ? discordHome : discordServers.find((s) => s.id === id); }
      function findChannel(id) {
        for (const s of allServers()) for (const c of s.channels) for (const ch of c.items) if (ch.id === id) return ch;
        return null;
      }
      function preferredChannel(server) {
        if (server === discordHome) return findChannel("bedsheat") || server.channels[0].items[0];
        const all = server.channels.flatMap((c) => c.items);
        return all.find((ch) => ch.id === "general" && ch.type === "text") || all.find((ch) => ch.type === "text") || all[0];
      }
      function totalUnread() {
        let t = state.unreadRule ? 1 : 0;
        for (const k in state.unreadChannels) t += state.unreadChannels[k];
        return t;
      }
      function avInner(it) {
        if (it && it.avImg) return `<img src="${it.avImg}" class="av-img" alt="">`;
        return escapeHTML((it && it.avEmoji) || initials((it && (it.name || it.author)) || "?"));
      }
      function avStyle(it) { return (it && it.avImg) ? "" : `background:${(it && it.color) || "#5865f2"}`; }

      function renderServers() {
        const sofiaUnread = (state.unreadChannels && state.unreadChannels.sofia) || 0;
        const sofiaActive = state.activeServer === "home" && state.activeChannel === "sofia";
        const showSofia = sofiaUnread > 0 || sofiaActive || state.sofiaTriggered;
        const tu = totalUnread();

        serversEl.innerHTML =
          `<div class="server-icon home ${state.activeServer === "home" && !sofiaActive ? "active" : ""}" data-server="home" title="Direct Messages">${DISCORD_SVG(26)}${tu > 0 ? `<span class="home-badge">${tu > 9 ? "9+" : tu}</span>` : ""}</div>` +
          (showSofia ? `<div class="server-separator"></div><div class="server-icon dm-contact ${sofiaActive ? "active" : ""}" data-server="home" data-dm="sofia" title="✧ Sofia ✧"><img src="static/sofia.webp" alt="Sofia" style="width:100%;height:100%;border-radius:inherit;object-fit:cover" /><div class="dm-ping-badge ${sofiaUnread > 0 && !sofiaActive ? 'show' : ''}">${sofiaUnread}</div></div>` : '') +
          `<div class="server-separator"></div>` +
          discordServers.map((s) => `<div class="server-icon ${state.activeServer === s.id ? "active" : ""}" data-server="${s.id}" title="${escapeHTML(s.name)}" style="background:${s.color}">${initials(s.name)}</div>`).join("") +
          `<div class="server-separator"></div>` +
          `<div class="server-icon add" data-server="add" title="Add a Server">+</div>`;
      }

      function renderChannels() {
        const server = getServer(state.activeServer);
        if (!server) return;

        if (server === discordHome) {
          serverNameEl.style.display = "none";
          homeTopEl.style.display = "block";
          const items = server.channels[0].items;
          channelsEl.innerHTML =
            `<div class="dm-section-head"><span>Direct Messages</span><button class="dm-add" data-nav="add-dm" title="Add">+</button></div>` +
            items.map((it) => {
              const unread = state.unreadChannels[it.id] || 0;
              const badge = unread
                ? `<span class="unread-badge">${unread > 9 ? "9+" : unread}</span>`
                : (it.badge ? `<span class="name-badge">${escapeHTML(it.badge)}</span>` : "");
              const sub = it.inVoice
                ? `<div class="dm-sub voice"><span class="voice-ico">🔊</span> In voice</div>`
                : (it.sub ? `<div class="dm-sub">${escapeHTML(it.sub)}</div>` : "");
              return `
                <div class="dm-item ${it.id === state.activeChannel ? "active" : ""}" data-channel="${it.id}">
                  <div class="dm-av">
                    <div class="avatar sm-av" style="${avStyle(it)}">${avInner(it)}</div>
                    ${it.status ? `<span class="status-dot st-${it.status}"></span>` : ""}
                  </div>
                  <div class="dm-text"><div class="dm-name">${escapeHTML(it.name)}${badge}</div>${sub}</div>
                </div>`;
            }).join("");
        } else {
          homeTopEl.style.display = "none";
          serverNameEl.style.display = "flex";
          serverNameEl.textContent = server.name;
          channelsEl.innerHTML = server.channels.map((cat) => `
            <div class="channel-category"><span>${escapeHTML(cat.category)}</span><span class="category-add">▾</span></div>
            ${cat.items.map((ch) => {
              let uc = 0;
              if (ch.id === "rule" && state.unreadRule) uc = 1;
              else if (state.unreadChannels[ch.id]) uc = state.unreadChannels[ch.id];
              const ub = uc ? `<span class="unread-badge">${uc > 9 ? "9+" : uc}</span>` : "";
              return `
                <div class="channel-item ${ch.id === state.activeChannel ? "active" : ""}" data-channel="${ch.id}">
                  <span class="channel-prefix">${ch.type === "voice" ? "🔊" : "#"}</span>
                  <span class="channel-label">${escapeHTML(ch.name)}</span>${ub}
                </div>`;
            }).join("")}
          `).join("");
        }

        const act = channelsEl.querySelector(".active");
        if (act) act.scrollIntoView({ block: "nearest" });
      }

      function renderMessages(ch) {
        const arr = discordMessageData[ch.id];
        const msgs = (arr && arr.length) ? arr : (arr === undefined ? discordDefaultMessages(ch) : arr);
        let html = "";
        let prev = null;
        msgs.forEach((m) => {
          if (m.dividerBefore) html += `<div class="new-divider"><span class="new-line"></span><span class="new-pill">NEW</span></div>`;
          html += messageHTML(m, prev !== m.author);
          prev = m.author;
        });
        messagesEl.innerHTML = html;
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function renderMembers() {
        membersEl.innerHTML =
          `<div class="member-category">Online — ${discordMembers.online.length}</div>` +
          discordMembers.online.map(memberHTML).join("") +
          `<div class="member-category">Offline — ${discordMembers.offline.length}</div>` +
          discordMembers.offline.map(memberHTML).join("");
      }

      function renderMain() {
        const server = getServer(state.activeServer);
        const isHome = server === discordHome;
        const ch = findChannel(state.activeChannel);

        if (titleTextEl) titleTextEl.innerHTML = DISCORD_SVG(18) + `<span>${isHome ? "Direct Messages" : escapeHTML(server.name)}</span>`;
        membersEl.classList.toggle("hidden", isHome || !state.membersVisible);
        if (!ch) return;

        if (isHome) {
          headerEl.innerHTML =
            `<div class="ch-avatar" style="${avStyle(ch)}">${avInner(ch)}</div>` +
            `<span class="channel-name">${escapeHTML(ch.name)}</span>` +
            (ch.inVoice || ch.sub ? `<span class="ch-status">${ch.inVoice ? "🔊 In voice" : escapeHTML(ch.sub)}</span>` : "") +
            `<span class="spacer"></span>` +
            `<div class="ch-icons">` +
              `<button class="ch-icon" data-act="Call" title="Start voice call">📞</button>` +
              `<button class="ch-icon" data-act="Video" title="Start video call">🎥</button>` +
              `<button class="ch-icon pin" data-act="Pinned" title="Pinned messages">📌<span class="pin-dot"></span></button>` +
              `<button class="ch-icon" data-act="Add Friend" title="Add friend to DM">👤＋</button>` +
              `<button class="ch-icon" data-act="Profile" title="User profile">🧑</button>` +
            `</div>` +
            `<div class="ch-search"><span class="ch-search-ico">🔍</span><input disabled placeholder="Search ${escapeHTML(ch.name)}"></div>`;
          inputWrap.style.display = "block";
          input.placeholder = `Message @${ch.name}`;
          renderMessages(ch);
        } else {
          headerEl.innerHTML =
            `<span class="channel-hash">${ch.type === "voice" ? "🔊" : "#"}</span>` +
            `<span class="channel-name">${escapeHTML(ch.name)}</span>` +
            (ch.topic ? `<span class="topic">${escapeHTML(ch.topic)}</span>` : "") +
            `<span class="spacer"></span>` +
            `<div class="ch-search"><span class="ch-search-ico">🔍</span><input disabled placeholder="Search ${escapeHTML(ch.name)}"></div>`;
          if (ch.type === "voice") {
            inputWrap.style.display = "none";
            messagesEl.innerHTML = voiceHTML(ch);
          } else {
            inputWrap.style.display = "block";
            input.placeholder = `Message #${ch.name}`;
            renderMessages(ch);
          }
        }
      }

      function selectServer(id) {
        if (id === "add") { showToast("Add a Server is visual only."); return; }
        const server = getServer(id);
        if (!server) return;
        state.activeServer = id;
        const ch = preferredChannel(server);
        state.activeChannel = ch ? ch.id : null;
        renderServers();
        renderChannels();
        renderMain();
      }

      function selectChannel(ch) {
        if (!ch) return;
        state.activeChannel = ch.id;

        if (ch.id === "rule" && state.unreadRule) {
          state.unreadRule = false;
          markBirthdayRuleRead();
        }
        if (state.unreadChannels[ch.id]) delete state.unreadChannels[ch.id];

        if (ch.id === "rule" && !state.sofiaTriggered) {
          state.sofiaTriggered = true;
          setTimeout(() => { if (typeof startSofiaPanic === "function") startSofiaPanic(); }, 4500);
        }

        renderChannels();
        renderMain();
        refreshDockBadge();
      }

      function markChannelUnread(id) { state.unreadChannels[id] = (state.unreadChannels[id] || 0) + 1; }
      function refreshDockBadge() {
        const tu = totalUnread();
        const b = document.getElementById("discordDockBadge");
        if (!b) return;
        if (tu > 0) { b.textContent = tu > 9 ? "9+" : String(tu); b.classList.remove("hidden"); }
        else b.classList.add("hidden");
      }
      function openDM(id) { selectServer("home"); const ch = findChannel(id); if (ch) selectChannel(ch); }

      function updateUser() {
        muteBtn.classList.toggle("active", state.muted);
        deafenBtn.classList.toggle("active", state.deafened);
        userStatusEl.textContent = state.deafened ? "Deafened" : state.muted ? "Muted" : "Online";
      }

      serversEl.addEventListener("click", (e) => {
        const s = e.target.closest("[data-server]");
        if (s) {
          if (s.dataset.dm) {
            openDM(s.dataset.dm);
          } else {
            selectServer(s.dataset.server);
          }
          return;
        }
        if (e.target.closest("[data-decor]")) showToast("This server is visual only.");
      });
      channelsEl.addEventListener("click", (e) => {
        const el = e.target.closest("[data-channel]");
        if (el) selectChannel(findChannel(el.dataset.channel));
      });
      homeTopEl.addEventListener("click", (e) => {
        const b = e.target.closest("[data-nav]");
        if (b) showToast(`${b.dataset.nav} is visual only.`);
      });
      serverNameEl.addEventListener("click", () => showToast("Server menu is visual only."));
      headerEl.addEventListener("click", (e) => {
        const b = e.target.closest("[data-act]");
        if (b) showToast(`${b.dataset.act} is visual only.`);
      });
      const tbInbox = win.querySelector('[data-tb="inbox"]');
      const tbHelp = win.querySelector('[data-tb="help"]');
      if (tbInbox) tbInbox.addEventListener("click", () => showToast("Inbox is visual only."));
      if (tbHelp) tbHelp.addEventListener("click", () => showToast("Help is visual only."));

      muteBtn.addEventListener("click", () => { state.muted = !state.muted; if (state.muted) state.deafened = false; updateUser(); });
      deafenBtn.addEventListener("click", () => { state.deafened = !state.deafened; state.muted = state.deafened; updateUser(); });
      settingsBtn.addEventListener("click", () => showToast("Settings are visual only."));

      function trySend() {
        if (!input.value.trim()) return;
        showToast("No chat/server is implemented — message not sent.");
        input.value = "";
        sendBtn.classList.add("hidden");
      }
      input.addEventListener("input", () => sendBtn.classList.toggle("hidden", !input.value.trim()));
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") trySend(); });
      sendBtn.addEventListener("click", trySend);
      win.querySelectorAll("[data-in]").forEach((b) => b.addEventListener("click", () => showToast(`${b.dataset.in} is visual only.`)));

      messagesEl.addEventListener("click", (e) => {
        if (e.target.closest(".voice-join")) showToast("Voice is UI only — no voice server is connected.");
      });

      updateUser();
      selectServer(state.activeServer);
      renderMembers();

      win.selectBirthdayRule = function () {
        selectServer("s1");
        const r = findChannel("rule");
        if (r) selectChannel(r);
      };
      win.discord = {
        getActiveChannel: () => state.activeChannel,
        markChannelUnread,
        openDM,
        refreshDockBadge,
        refresh(changedId) {
          renderServers();
          renderChannels();
          if (changedId && state.activeChannel === changedId) {
            const ch = findChannel(changedId);
            if (ch) renderMessages(ch);
          }
        }
      };
    }

    /* ---------------- Global events ---------------- */

    appMenus.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-appmenu]");
      if (!btn) return;
      showToast(`${activeApp} → ${btn.dataset.appmenu} is visual only.`);
    });

    appleBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      menuDropdown.classList.toggle("open");
    });

    document.addEventListener("click", () => {
      menuDropdown.classList.remove("open");
    });

    menuDropdown.addEventListener("click", (e) => {
      e.stopPropagation();
      const item = e.target.closest("[data-action]");
      if (item) {
        showToast(item.dataset.action);
        menuDropdown.classList.remove("open");
      }
    });

    document.querySelector(".menubar .right").addEventListener("click", (e) => {
      const btn = e.target.closest(".status-btn");
      if (!btn) return;
      showToast(`${btn.title} is visual only.`);
    });

    dock.addEventListener("click", (e) => {
      const icon = e.target.closest(".dock-icon");
      if (!icon) return;

      const app = icon.dataset.app;

      if (app === "chrome") {
        openApp("chrome");
      } else if (app === "discord") {
        openApp("discord");

        const win = document.getElementById("discord-window");
        if (birthdayRuleUnread && win && typeof win.selectBirthdayRule === "function") {
          win.selectBirthdayRule();
        }
      } else {
        showToast(`${icon.dataset.name || cap(app)} is not part of this mock.`);
      }
    });

    desktop.addEventListener("pointerdown", (e) => {
      if (e.target === desktop) {
        setMenuBar("Finder");
        document.querySelectorAll(".window").forEach((w) => w.classList.remove("focused"));
      }
    });

    function updateClock() {
      const d = new Date();
      const date = d.toLocaleDateString(undefined, {
        weekday: "short",
        month: "short",
        day: "numeric"
      });
      const time = d.toLocaleTimeString(undefined, {
        hour: "numeric",
        minute: "2-digit"
      });
      clockEl.textContent = `${date}  ${time}`;
    }

    /* ---------------- Init ---------------- */

    setMenuBar("Finder");
    updateClock();
    setInterval(updateClock, 20000);
    updateDock();

    let walkthroughStarted = false;

    function startWalkthrough(delay = 1200) {
      if (walkthroughStarted) return;
      walkthroughStarted = true;
      setTimeout(() => showBirthdayNotification(), delay);
    }

    const params = new URLSearchParams(window.location.search);
    const shouldStart = params.get("start") === "1";

    let inIframe = false;
    try { inIframe = window.self !== window.top; } catch (e) { inIframe = true; }

    if (shouldStart || inIframe) {
      document.body.classList.add("kiosk");
    }

    if (shouldStart) {
      startWalkthrough();
    }
  </script>
</body>
</html>
